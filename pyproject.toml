[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-glm5x"
version = "0.1.0.dev0"
description = "A GLM-5.x-specific out-of-core inference engine"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "google-crc32c==1.8.0",
  "numpy==2.5.2",
  "psutil==7.2.2",
  "safetensors==0.8.0",
  "torch==2.13.0",
]

[project.scripts]
glm5x-convert = "glm5x_converter.cli:main"
glm5x-export-moe-activation = "glm5x_ref.activation_export:main"

[project.optional-dependencies]
dev = [
  "cmake==4.4.3",
  "ninja==1.13.0",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["reference", "converter"]

[tool.pytest.ini_options]
pythonpath = ["reference", "converter"]
testpaths = ["tests/python"]
addopts = "--strict-config --strict-markers"
